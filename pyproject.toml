[project]
name = "miner-widget-stats"
version = "1.0.0"
description = "Shows mining hashrate and room temperature in the macOS menu bar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jan Alexandr Kopřiva", email = "jan.alexandr.kopriva@gmail.com" }]
keywords = ["macos", "menu-bar", "mining", "tuya", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = ["requests>=2.33.0", "python-dotenv>=1.2.2", "rumps>=0.4; sys_platform == 'darwin'"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/koprjaa/miner-widget-stats"
Repository = "https://github.com/koprjaa/miner-widget-stats"
Issues = "https://github.com/koprjaa/miner-widget-stats/issues"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "PTH", "TRY", "PERF", "RUF"]
# E501  line length is handled by the formatter, not worth failing CI over
# TRY003 wants one exception subclass per message. That is ceremony for a
#        message a reader needs, so informative raises stay.
ignore = [
    "E501",    # line length is handled by the formatter
    "TRY003",  # one exception subclass per message is ceremony
    # Each guard wraps a single network call. The cost is the request.
    "PERF203",
    # The value returned is what the log line above it just described.
    "TRY300",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.uv]
package = false
