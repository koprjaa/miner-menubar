# Project: miner-menubar
# File: Cargo.toml
# Description: Rust package and dependency definitions.
# Author: Jan Alexandr Kopřiva
# License: AGPL-3.0-or-later
[package]
name = "miner-menubar"
version = "1.0.0"
edition = "2021"
authors = ["Jan Alexandr Kopřiva"]
license = "AGPL-3.0-or-later"
description = "Shows mining hashrate and room temperature in the macOS menu bar."

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.1"
tray-icon = "0.26.1"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
